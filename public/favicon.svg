<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;display=block');
      .bg { fill: #061018; }
      .letters {
        font-family: 'Syne', 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        font-size: 13px;
        fill: #ea580c;
        letter-spacing: -0.03em;
      }
    </style>
  </defs>
  <!-- Background rounded square -->
  <rect class="bg" width="32" height="32" rx="6" ry="6"/>
  <!-- TH initials, optically centered -->
  <text class="letters" x="16" y="22" text-anchor="middle" dominant-baseline="auto">TH</text>
</svg>
